<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mart Checkout</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f7f1e8;color:#252525}
  .app{max-width:430px;margin:auto;min-height:100vh;padding:20px 16px 30px}
  .header{text-align:center;margin-bottom:16px}
  .header h1{margin:0;font-size:30px}
  .header p{margin:5px 0;color:#777}
  .card{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #00000012}
  #reader{width:100%;overflow:hidden;border-radius:14px}
  .total{text-align:center}
  .total small{color:#777}
  .amount{font-size:44px;font-weight:800;margin:4px 0}
  #items{max-height:190px;overflow:auto}
  .item{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #eee}
  .empty{text-align:center;color:#999;padding:20px}
  button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:9px;font-size:16px;font-weight:700;cursor:pointer}
  .save{background:#222;color:white}
  .new{background:#eee}
  .status{text-align:center;font-size:14px;color:#777;margin-top:10px}
  .history h3{margin-top:0}
  .bill{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🛒 Mini Mart</h1>
    <p>Scan • Add • Save</p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div class="status" id="status">Point the camera at a barcode</div>
  </div>

  <div class="card total">
    <small>CURRENT TOTAL</small>
    <div class="amount" id="total">₹0</div>
  </div>

  <div class="card">
    <div id="items"><div class="empty">No items scanned yet</div></div>
  </div>

  <div class="card">
    <button class="save" onclick="saveBill()">💾 SAVE BILL</button>
    <button class="new" onclick="newCustomer()">🧾 NEW CUSTOMER</button>
  </div>

  <div class="card history">
    <h3>Saved Bills</h3>
    <div id="history"><div class="empty">No saved bills yet</div></div>
  </div>
</div>

<script>
const prices = {
  "100001": 10,
  "100002": 20,
  "100003": 50,
  "100004": 100,
  "100005": 200
};

let items = [];
let total = 0;
let billNumber = Number(localStorage.getItem("billNumber") || 0);
let history = JSON.parse(localStorage.getItem("miniMartHistory") || "[]");

function addBarcode(code){
  if (!(code in prices)) {
    document.getElementById("status").textContent = "Barcode not in price list: " + code;
    return;
  }
  const price = prices[code];
  items.push(price);
  total += price;
  render();
  document.getElementById("status").textContent = "Added ₹" + price + " ✓";
}

function render(){
  document.getElementById("total").textContent = "₹" + total;
  const box = document.getElementById("items");
  if (!items.length) {
    box.innerHTML = '<div class="empty">No items scanned yet</div>';
    return;
  }
  box.innerHTML = items.map((p,i) =>
    `<div class="item"><span>Item ${i+1}</span><b>₹${p}</b></div>`
  ).join("");
}

function saveBill(){
  if (!items.length) return;
  billNumber++;
  localStorage.setItem("billNumber", billNumber);
  history.unshift({bill: billNumber, total: total, count: items.length});
  localStorage.setItem("miniMartHistory", JSON.stringify(history));
  renderHistory();
  document.getElementById("status").textContent = "Bill #" + billNumber + " saved ✓";
}

function newCustomer(){
  items = [];
  total = 0;
  render();
  document.getElementById("status").textContent = "Ready for the next customer";
}

function renderHistory(){
  const box = document.getElementById("history");
  if (!history.length) {
    box.innerHTML = '<div class="empty">No saved bills yet</div>';
    return;
  }
  box.innerHTML = history.map(b =>
    `<div class="bill"><span>Customer ${b.bill}</span><b>₹${b.total}</b></div>`
  ).join("");
}

function onScanSuccess(decodedText) {
  addBarcode(decodedText);
}

const scanner = new Html5QrcodeScanner(
  "reader",
  { fps: 10, qrbox: { width: 250, height: 120 }, rememberLastUsedCamera: true },
  false
);
scanner.render(onScanSuccess, () => {});
render();
renderHistory();
</script>
</body>
</html>
